name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: [rust-version, stable]
    steps:
      - uses: actions/checkout@v7

      # rust-version is the oldest Rust that Cargo.toml says builds the crate.
      - name: Install Rust
        env:
          RUST: ${{ matrix.rust }}
        run: |
          if [ "$RUST" = rust-version ]; then
            RUST=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          fi
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"

      - uses: Swatinem/rust-cache@v2

      # --locked fails if Cargo.lock does not match Cargo.toml.
      - name: Build
        run: cargo build --locked --all-targets

      # Includes the relay-only and built-binary end-to-end tests, which use the
      # public n0 relays and are marked #[ignore], and the spec suite, which
      # checks the code against .regenerate/SPEC.md.
      - name: Test
        run: cargo test --locked -- --include-ignored
