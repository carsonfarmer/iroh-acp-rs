[package]
name = "iroh-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "The Agent Client Protocol over iroh"
publish = false

[dependencies]
agent-client-protocol = "3.0.0"
iroh = "1.3.0"
iroh-tickets = "1.0.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["compat", "rt"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
doc_markdown = "warn"
semicolon_if_nothing_returned = "warn"

# The spec suite in .regenerate. A blind rebuild starts without these tables.
[[test]]
name = "spec"
path = ".regenerate/spec.rs"

[[example]]
name = "spec-echo"
path = ".regenerate/echo.rs"
